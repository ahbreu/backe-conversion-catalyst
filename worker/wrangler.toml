name = "backe-lead-proxy"
main = "src/index.js"
compatibility_date = "2026-05-01"

[vars]
APP_ENV = "production"
COMPANY_NAME = "BACKE.co"
FRONTEND_URL = "https://backe.com.br,https://www.backe.com.br"
META_GRAPH_API_VERSION = "v23.0"
META_WHATSAPP_TEMPLATE_NAME = "backe_site_lead_welcome"
META_WHATSAPP_TEMPLATE_LANGUAGE = "pt_BR"
META_REQUEST_TIMEOUT_MS = "10000"
META_RETRY_ATTEMPTS = "3"
META_RETRY_BASE_DELAY_MS = "500"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX = "20"
LEAD_IDEMPOTENCY_WINDOW_MS = "300000"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "LEADS_DB"
database_name = "backe-leads"
database_id = "1afdc13d-f885-48a1-8fb4-12ab59b6e61e"
migrations_dir = "migrations"
