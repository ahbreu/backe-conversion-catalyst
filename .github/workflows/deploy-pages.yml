name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check required site configuration
        # Fail closed: sem estas variáveis o formulário publicado não conseguiria enviar leads.
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_WHATSAPP_PHONE: ${{ vars.VITE_PUBLIC_WHATSAPP_PHONE }}
        run: |
          missing=()
          for name in VITE_API_URL VITE_TURNSTILE_SITE_KEY VITE_PUBLIC_WHATSAPP_PHONE; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Site configuration missing::Set repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Build site
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL != '' && vars.PUBLIC_SITE_URL || 'https://backe.com.br' }}
          BASE_PATH: ${{ vars.VITE_BASE_PATH != '' && vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_META_PIXEL_REQUIRE_CONSENT: ${{ vars.VITE_META_PIXEL_REQUIRE_CONSENT }}
          VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          VITE_PUBLIC_WHATSAPP_PHONE: ${{ vars.VITE_PUBLIC_WHATSAPP_PHONE }}
          VITE_PUBLIC_WHATSAPP_MESSAGE: ${{ vars.VITE_PUBLIC_WHATSAPP_MESSAGE }}
          VITE_PUBLIC_CONTACT_EMAIL: ${{ vars.VITE_PUBLIC_CONTACT_EMAIL }}
        run: npm run build

      - name: Write CNAME
        if: ${{ vars.PAGES_CNAME != '' }}
        run: echo "${{ vars.PAGES_CNAME }}" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
